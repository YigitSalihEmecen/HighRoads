<!doctype html>
<!--
  The TreeGen canopy's contact sheet (probe/canopy.mjs photographs the legacy
  one). Under the game's own exposure and lights:

    ?level=N          every species, both variants, at level N, in a grid
                      (&names=pine,oak for some of them)
    ?species=oak      one species (or shrub), every level side by side at one size

  Wind is held still. Add &sky=1 for the game's sky colour as background.
-->
<meta charset="utf-8">
<title>forest contact sheet</title>
<style>html,body{margin:0;height:100%;background:#cfd8dc;overflow:hidden}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
    "meshoptimizer/simplifier": "https://cdn.jsdelivr.net/npm/meshoptimizer@1.3.0/meshopt_simplifier.js",
    "meshoptimizer/encoder": "https://cdn.jsdelivr.net/npm/meshoptimizer@1.3.0/meshopt_encoder.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { ATMOSPHERE, TREES } from '../src/config.js';
import { FOLIAGE, SHRUBS } from '../src/foliage.js';
import { createTreeGenAssetsAsync } from '../src/env/treegen.js';

const q = new URLSearchParams(location.search);
const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = ATMOSPHERE.exposure;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd3dde2);
scene.add(new THREE.HemisphereLight(ATMOSPHERE.hemiSky, ATMOSPHERE.hemiGround, ATMOSPHERE.hemiIntensity));
const sun = new THREE.DirectionalLight(ATMOSPHERE.sunColor, ATMOSPHERE.sunIntensity);
sun.position.set(-40, 60, 40);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, far: 400 });
sun.shadow.mapSize.set(4096, 4096);
scene.add(sun);

const species = q.get('species');
const names = species ? [species] : q.get('names') ? q.get('names').split(',') : null;
const trees = await createTreeGenAssetsAsync({ renderer, names: names || undefined });
trees.uniforms.uWindStrength.value = 0;

const put = (variant, level, x, z, h) => {
  for (const part of variant.levels[level].parts) {
    const m = new THREE.Mesh(part.geometry, part.material);
    m.position.set(x, 0, z);
    m.rotation.y = 0.7;
    m.scale.setScalar(h);
    m.castShadow = m.receiveShadow = true;
    scene.add(m);
  }
};

const camera = new THREE.PerspectiveCamera(30, W / H, 0.5, 2000);
if (species) {
  // one row: every level of variant 0, then variant 1 behind it
  const [v0, v1] = trees.library.get(species);
  const { height } = FOLIAGE[species] || SHRUBS[species];
  const h = (height[0] + height[1]) / 2;
  const gap = h * Math.max(0.7, v0.radius * 2.3);
  const n = trees.specs.length;
  for (let i = 0; i < n; i++) {
    put(v0, i, (i - (n - 1) / 2) * gap, 0, h);
    if (v1) put(v1, i, (i - (n - 1) / 2) * gap + gap * 0.5, -gap * 1.3, h);
  }
  camera.position.set(0, h * 0.9, gap * n * 1.55);
  camera.lookAt(0, h * 0.45, -gap * 0.4);
} else {
  const level = Math.min(trees.specs.length - 1, Number(q.get('level') || 0));
  let i = 0;
  const T = 12, GAP = 12;
  const cols = Math.min(8, trees.library.size);
  for (const [name, vs] of trees.library) {
    const x = ((i % cols) - (cols - 1) / 2) * GAP * 1.6, z = -Math.floor(i / cols) * 34;
    vs.forEach((v, k) => put(v, level, x + (k - 0.5) * GAP * 0.62, z - k * 6, T));
    i++;
  }
  const span = cols * GAP * 1.6;
  camera.position.set(0, 8 + span * 0.1, 18 + span * 0.95);
  camera.lookAt(0, 6, -10);
}

const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x93a86c, roughness: 1 }));
ground.receiveShadow = true;
scene.add(ground);

renderer.render(scene, camera);
window.READY = true;
</script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>FastRoads — infinite procedural driving</title>

<style>
  :root {
    --ink: #f4ead9;
    --dim: rgba(244, 234, 217, 0.55);
    --accent: #ffb457;
    --danger: #ff5f4d;
    --font: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0e0d12;
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  canvas { display: block; touch-action: none; }

  #app { position: fixed; inset: 0; }

  /* ---------------------------------------------------------------- HUD -- */

  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease 0.2s;
    z-index: 5;
  }
  #hud.live { opacity: 1; }

  #cluster {
    position: absolute;
    right: max(26px, var(--sar));
    bottom: max(22px, var(--sab));
    width: 208px;
    height: 208px;
    transition: transform 0.2s ease, right 0.2s ease, bottom 0.2s ease;
  }

  #cluster svg { width: 100%; height: 100%; overflow: visible; }

  .tach-track { fill: none; stroke: rgba(244, 234, 217, 0.14); stroke-width: 6; stroke-linecap: round; }
  .tach-fill  { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round;
                filter: drop-shadow(0 0 6px rgba(255, 180, 87, 0.55)); }
  .tach-red   { fill: none; stroke: var(--danger); stroke-width: 6; stroke-linecap: round; opacity: 0.35; }

  #speed-val {
    position: absolute;
    left: 0; right: 0;
    top: 78px;
    text-align: center;
    font-size: 46px;
    font-weight: 600;
    letter-spacing: -2px;
    line-height: 1;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  }
  #speed-unit {
    position: absolute;
    left: 0; right: 0;
    top: 126px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--dim);
  }
  #gear {
    position: absolute;
    left: 0; right: 0;
    bottom: 26px;
    text-align: center;
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--accent);
    transition: transform 0.18s ease-out, color 0.18s ease-out, text-shadow 0.18s;
  }
  #gear.shift {
    transform: scale(1.5);
    color: #fff;
    text-shadow: 0 0 14px rgba(255, 180, 87, 0.9);
    transition-duration: 0.04s;
  }

  #gear-mode {
    position: absolute;
    left: 0; right: 0;
    bottom: 10px;
    text-align: center;
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(244, 234, 217, 0.4);
  }
  #gear-mode.manual { color: var(--accent); }

  #trip {
    position: absolute;
    left: max(26px, var(--sal));
    bottom: max(24px, var(--sab));
    font-size: 12px;
    line-height: 1.9;
    letter-spacing: 1px;
    color: var(--dim);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
  }
  #trip b { color: var(--ink); font-weight: 500; }

  #stats {
    position: absolute;
    left: max(26px, var(--sal));
    top: max(22px, var(--sat));
    font-size: 11px;
    line-height: 1.8;
    letter-spacing: 1px;
    color: var(--dim);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
  }

  /* ------------------------------------------------------------ overlay -- */

  /**
   * The middle of the title screen is TRANSPARENT. The car being chosen is the
   * real vehicle, sitting on the real road in the real scene, with the camera
   * orbiting it — so the picker shows exactly what will be driven, and paint
   * changes are simply a live material property rather than a preview of one.
   */
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background:
      linear-gradient(to bottom, rgba(12, 11, 16, 0.94) 0%, rgba(12, 11, 16, 0.5) 15%, rgba(12, 11, 16, 0) 32%),
      linear-gradient(to top,    rgba(12, 11, 16, 0.97) 0%, rgba(12, 11, 16, 0.88) 24%, rgba(12, 11, 16, 0) 54%);
    z-index: 15;
    transition: opacity 0.7s ease, visibility 0s;
    text-align: center;
    padding: max(18px, var(--sat)) max(18px, var(--sar)) max(16px, var(--sab)) max(18px, var(--sal));
    pointer-events: none;
  }
  #overlay.gone {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.7s ease, visibility 0s linear 0.7s;
  }
  #brand, #dock { pointer-events: auto; }

  #brand { display: flex; flex-direction: column; align-items: center; }
  #dock {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    width: min(940px, 96vw);
  }

  #title {
    font-size: clamp(24px, 5.2vw, 44px);
    font-weight: 700;
    letter-spacing: -2px;
    margin: 0;
    background: linear-gradient(100deg, #ffd9a0 0%, #ff9d4d 55%, #e8705a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #tagline { margin: -4px 0 0; font-size: 10px; letter-spacing: 4px; color: var(--dim); text-transform: uppercase; }

  #keys {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 3px 14px;
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(244, 234, 217, 0.38);
  }
  #keys span { white-space: nowrap; }
  #keys b { color: rgba(244, 234, 217, 0.72); font-weight: 500; }

  #start {
    pointer-events: auto;
    border: 1px solid rgba(255, 180, 87, 0.55);
    background: rgba(255, 180, 87, 0.14);
    color: var(--accent);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 5px;
    padding: 13px 52px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.25s, transform 0.15s, opacity 0.3s;
    text-transform: uppercase;
    box-shadow: 0 4px 18px rgba(255, 180, 87, 0.2);
  }
  #start:hover { background: rgba(255, 180, 87, 0.22); }
  #start:active { transform: scale(0.97); }
  #start:disabled { opacity: 0.35; cursor: default; }

  #boot { font-size: 11px; letter-spacing: 2px; color: var(--dim); min-height: 16px; }

  /* ------------------------------------------------------------ garage -- */

  #garage {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    width: 100%;
  }
  #garage.ready { display: flex; }

  #car-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    pointer-events: auto;
    max-width: 100%;
  }

  .car-chip {
    border: 1px solid rgba(244, 234, 217, 0.16);
    background: rgba(244, 234, 217, 0.04);
    color: var(--dim);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 2px;
    padding: 9px 15px;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: color 0.18s, border-color 0.18s, background 0.18s, transform 0.12s;
    white-space: nowrap;
  }
  .car-chip:hover { color: var(--ink); border-color: rgba(244, 234, 217, 0.4); }
  .car-chip:active { transform: scale(0.96); }
  .car-chip[aria-pressed="true"] {
    color: var(--accent);
    border-color: rgba(255, 180, 87, 0.7);
    background: rgba(255, 180, 87, 0.14);
    box-shadow: 0 0 12px rgba(255, 180, 87, 0.25);
  }

  .garage-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
  }
  .garage-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(244, 234, 217, 0.35);
    text-transform: uppercase;
    min-width: 54px;
    text-align: right;
  }

  .swatch {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid rgba(244, 234, 217, 0.2);
    cursor: pointer;
    padding: 0;
    transition: transform 0.15s, border-color 0.15s;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch[aria-pressed="true"] {
    border-color: var(--accent);
    transform: scale(1.22);
    box-shadow: 0 0 10px rgba(255, 180, 87, 0.5);
  }

  .eng-chip {
    border: 1px solid rgba(244, 234, 217, 0.14);
    background: none;
    color: var(--dim);
    font-family: var(--font);
    font-size: 10px;
    letter-spacing: 1.5px;
    padding: 6px 10px;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    white-space: nowrap;
  }
  .eng-chip:hover { color: var(--ink); border-color: rgba(244, 234, 217, 0.35); }
  .eng-chip[aria-pressed="true"] {
    color: var(--accent);
    border-color: rgba(255, 180, 87, 0.65);
    background: rgba(255, 180, 87, 0.12);
  }

  #seed-input {
    background: rgba(244, 234, 217, 0.05);
    border: 1px solid rgba(244, 234, 217, 0.16);
    color: var(--ink);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 2px;
    padding: 6px 10px;
    width: 150px;
    border-radius: 3px;
    outline: none;
  }
  #seed-input:focus { border-color: rgba(255, 180, 87, 0.55); }

  #car-detail {
    min-height: 38px;
    max-width: 680px;
    text-align: center;
    font-size: 12px;
    line-height: 1.6;
    color: var(--dim);
    letter-spacing: 0.5px;
  }
  #car-detail b { color: var(--ink); font-weight: 500; }

  #car-stats {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--dim);
    text-transform: uppercase;
  }
  #car-stats span b { display: block; color: var(--accent); font-size: 14px;
                      letter-spacing: 0; margin-top: 2px; font-weight: 600; }
  /* Tapping a car or an engine blips the throttle; flash the chip with it. */
  .car-chip.revving, .eng-chip.revving {
    border-color: rgba(255, 180, 87, 0.9);
    box-shadow: 0 0 14px rgba(255, 180, 87, 0.35);
  }
  #boot.err { color: var(--danger); letter-spacing: 1px; max-width: 620px; line-height: 1.7; }

  /* ----------------------------------------------------------- settings -- */

  #settings {
    position: fixed;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: stretch;
    z-index: 25;
    font-family: var(--font);
  }

  #settings-panel {
    width: 0;
    overflow: hidden;
    transition: width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    background: rgba(16, 15, 18, 0.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(244, 234, 217, 0.12);
    border-left: none;
    border-radius: 0 4px 4px 0;
  }
  #settings.open #settings-panel { width: 268px; }

  #settings-body {
    width: 268px;
    max-height: min(78vh, 620px);
    overflow-y: auto;
    padding: 14px 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  #settings-body::-webkit-scrollbar { width: 6px; }
  #settings-body::-webkit-scrollbar-thumb { background: rgba(244, 234, 217, 0.16); }

  #settings-toggle {
    align-self: center;
    width: 22px;
    height: 60px;
    border: 1px solid rgba(244, 234, 217, 0.12);
    border-left: none;
    border-radius: 0 4px 4px 0;
    background: rgba(16, 15, 18, 0.6);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--dim);
    font-family: var(--font);
    font-size: 13px;
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
  }
  #settings-toggle:hover { color: var(--ink); background: rgba(30, 28, 32, 0.75); }

  .set-section {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(244, 234, 217, 0.32);
    margin: 10px 0 2px;
    border-bottom: 1px solid rgba(244, 234, 217, 0.08);
    padding-bottom: 5px;
  }
  .set-section:first-child { margin-top: 0; }

  .set-row {
    display: grid;
    grid-template-columns: 84px 1fr 34px;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--dim);
  }
  .set-name { text-transform: uppercase; }
  .set-val { text-align: right; color: rgba(244, 234, 217, 0.75); font-size: 9px; }

  .set-row input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    background: rgba(244, 234, 217, 0.16);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .set-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .set-row input[type="range"]::-moz-range-thumb {
    width: 11px; height: 11px; border: none; border-radius: 50%;
    background: var(--accent); cursor: pointer;
  }

  .set-btn {
    border: 1px solid rgba(244, 234, 217, 0.14);
    background: rgba(244, 234, 217, 0.03);
    color: var(--dim);
    font-family: var(--font);
    font-size: 10px;
    letter-spacing: 1.5px;
    padding: 8px 10px;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
    text-align: left;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .set-btn:hover { color: var(--ink); border-color: rgba(244, 234, 217, 0.35); }
  .set-btn.on {
    color: var(--accent);
    border-color: rgba(255, 180, 87, 0.5);
    background: rgba(255, 180, 87, 0.08);
  }

  /* -------------------------------------------------------------- touch -- */

  #touch { display: none; }
  /* Shown only where there is a touch screen — see input.js. */
  body.touch #touch {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    touch-action: none;
  }

  .pad {
    position: absolute;
    display: flex;
    gap: 10px;
    pointer-events: auto;
    touch-action: none;
  }
  .pad-left  {
    left: max(16px, var(--sal));
    bottom: max(18px, var(--sab));
  }
  .pad-right {
    right: max(16px, var(--sar));
    bottom: max(18px, var(--sab));
  }
  .pad-aux   {
    right: max(14px, var(--sar));
    top: max(14px, var(--sat));
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 210px;
    gap: 6px;
  }

  .tbtn {
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    border: 1px solid rgba(244, 234, 217, 0.22);
    background: rgba(18, 17, 20, 0.48);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--ink);
    font-family: var(--font);
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    transition: background 0.08s, transform 0.08s, border-color 0.08s;
  }
  .tbtn:active, .tbtn.on {
    background: rgba(255, 180, 87, 0.38);
    border-color: rgba(255, 180, 87, 0.85);
    box-shadow: 0 0 16px rgba(255, 180, 87, 0.5);
    transform: scale(0.95);
  }
  .steer, .pedal {
    width: 76px;
    height: 76px;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pedal.go {
    background: rgba(45, 125, 65, 0.45);
    border-color: rgba(90, 200, 120, 0.4);
  }
  .pedal.go:active, .pedal.go.on {
    background: rgba(60, 160, 85, 0.7);
    border-color: rgba(100, 240, 140, 0.9);
    box-shadow: 0 0 18px rgba(90, 220, 130, 0.6);
  }
  .small {
    min-width: 42px;
    height: 32px;
    font-size: 10px;
    letter-spacing: 1px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ------------------------------------------------------------- run HUD -- */

  #run {
    position: absolute;
    left: 0; right: 0;
    top: max(14px, var(--sat));
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 6;
  }
  /* Only Traffic mode has a score; Zen mode is just driving. */
  #hud.traffic #run { display: flex; }

  #score {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -1px;
    line-height: 1;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.75);
    transition: transform 0.13s ease-out, color 0.13s ease-out;
  }
  #score.pop { transform: scale(1.16); color: var(--accent); transition-duration: 0.04s; }

  #chain {
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #chain.live { opacity: 1; }
  #mult { font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: 0; }
  #chain-bar {
    width: 120px; height: 3px;
    background: rgba(244, 234, 217, 0.16);
    border-radius: 2px;
    overflow: hidden;
  }
  #chain-bar i {
    display: block; height: 100%; width: 100%;
    background: var(--accent);
    transform-origin: left center;
  }

  #award {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.35s, transform 0.35s;
  }
  #award.show { opacity: 1; transform: translateY(-2px); }
  #award.oncoming { color: #ff9d6b; }

  /* ----------------------------------------------------------- game over -- */

  #gameover {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: max(20px, var(--sat)) max(20px, var(--sar)) max(20px, var(--sab)) max(20px, var(--sal));
    background: radial-gradient(120% 90% at 50% 45%, rgba(34, 20, 18, 0.88) 0%, rgba(10, 9, 13, 0.96) 70%);
  }
  #gameover.show { display: flex; }
  .go-title { font-size: 12px; letter-spacing: 6px; color: var(--danger); text-transform: uppercase; }
  #go-points {
    display: block;
    font-size: clamp(42px, 10vw, 70px);
    font-weight: 700;
    letter-spacing: -3px;
    line-height: 1;
  }
  .go-sub { font-size: 10px; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; }
  #go-record { color: var(--accent); min-height: 14px; }
  .go-actions { display: flex; gap: 10px; margin-top: 8px; }
  .go-actions button { font-size: 12px; padding: 12px 22px; letter-spacing: 2px; }

  #toast {
    position: fixed;
    left: 50%;
    top: max(34px, var(--sat));
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--ink);
    background: rgba(20, 17, 16, 0.78);
    border: 1px solid rgba(244, 234, 217, 0.14);
    padding: 9px 20px;
    border-radius: 3px;
    opacity: 0;
    transition: opacity 0.35s;
    pointer-events: none;
    z-index: 28;
    text-transform: uppercase;
  }
  #toast.show { opacity: 1; }

  /* ------------------------------------------- RESPONSIVE / MOBILE RULES -- */

  /* Touch devices: hide physical keyboard helper */
  body.touch #keys {
    display: none;
  }

  /* Mobile Portrait Layout */
  @media (max-width: 640px) {
    #title { font-size: 26px; }
    #tagline { font-size: 9px; letter-spacing: 3px; }
    #dock {
      gap: 7px;
      max-height: 52vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px;
      background: rgba(14, 13, 18, 0.76);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(244, 234, 217, 0.12);
      border-radius: 8px;
    }
    #car-list, #engine-list {
      flex-wrap: nowrap;
      overflow-x: auto;
      justify-content: flex-start;
      max-width: 100%;
      width: 100%;
      padding: 2px 2px 6px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #car-list::-webkit-scrollbar, #engine-list::-webkit-scrollbar {
      display: none;
    }
    .car-chip, .eng-chip {
      flex-shrink: 0;
    }
    #car-detail {
      font-size: 11px;
      line-height: 1.5;
      min-height: auto;
    }
    #car-stats {
      gap: 12px;
      font-size: 9px;
    }
    #car-stats span b {
      font-size: 13px;
    }
    #start {
      padding: 11px 40px;
      font-size: 13px;
    }

    /* In-game HUD in portrait */
    #cluster {
      right: max(14px, var(--sar));
      bottom: max(112px, var(--sab));
      transform: scale(0.78);
      transform-origin: bottom right;
    }
    #trip {
      left: max(14px, var(--sal));
      bottom: max(116px, var(--sab));
      font-size: 11px;
      line-height: 1.7;
    }
    #stats {
      left: max(14px, var(--sal));
      top: max(14px, var(--sat));
      font-size: 10px;
    }
  }

  /* Mobile Landscape Layout */
  @media (max-height: 520px) {
    #overlay {
      padding: max(8px, var(--sat)) max(14px, var(--sar)) max(8px, var(--sab)) max(14px, var(--sal));
      justify-content: space-between;
    }
    #brand {
      position: absolute;
      top: max(8px, var(--sat));
      left: max(16px, var(--sal));
      align-items: flex-start;
      text-align: left;
      z-index: 2;
    }
    #title { font-size: 20px; letter-spacing: -1px; }
    #tagline { font-size: 8px; letter-spacing: 2px; margin-top: -2px; }
    #keys { display: none; }
    #dock {
      gap: 5px;
      max-height: 48vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 6px 12px;
      background: rgba(14, 13, 18, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(244, 234, 217, 0.12);
      border-radius: 8px;
      width: min(840px, 94vw);
    }
    #garage {
      gap: 5px;
    }
    #car-list, #engine-list {
      flex-wrap: nowrap;
      overflow-x: auto;
      justify-content: flex-start;
      max-width: 100%;
      width: 100%;
      padding: 2px 2px 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #car-list::-webkit-scrollbar, #engine-list::-webkit-scrollbar {
      display: none;
    }
    .car-chip {
      flex-shrink: 0;
      padding: 6px 11px;
      font-size: 10px;
    }
    .eng-chip {
      flex-shrink: 0;
      padding: 4px 8px;
      font-size: 9px;
    }
    .garage-row {
      gap: 6px;
    }
    .garage-label {
      font-size: 9px;
      min-width: 44px;
    }
    .swatch {
      width: 20px;
      height: 20px;
    }
    #car-detail {
      font-size: 10px;
      line-height: 1.4;
      min-height: auto;
    }
    #car-stats {
      margin-top: 2px;
      gap: 12px;
      font-size: 8px;
    }
    #car-stats span b {
      font-size: 12px;
      margin-top: 1px;
    }
    #seed-input {
      padding: 4px 8px;
      font-size: 10px;
      width: 120px;
    }
    #start {
      padding: 8px 34px;
      font-size: 12px;
      letter-spacing: 3px;
    }
    #boot {
      font-size: 9px;
      min-height: 12px;
    }

    /* In-game HUD in landscape: cluster bottom-center between thumbs */
    #cluster {
      right: auto;
      left: 50%;
      bottom: max(6px, var(--sab));
      transform: translateX(-50%) scale(0.68);
      transform-origin: bottom center;
    }
    #trip {
      left: max(16px, var(--sal));
      top: max(46px, var(--sat));
      bottom: auto;
      font-size: 10px;
      line-height: 1.6;
    }
    #stats {
      left: max(16px, var(--sal));
      top: max(12px, var(--sat));
      font-size: 9px;
    }

    /* Touch Controls in landscape */
    .steer, .pedal {
      width: 64px;
      height: 64px;
      font-size: 20px;
    }
    .pad-left {
      left: max(14px, var(--sal));
      bottom: max(10px, var(--sab));
    }
    .pad-right {
      right: max(14px, var(--sar));
      bottom: max(10px, var(--sab));
    }
    .pad-aux {
      max-width: 220px;
      gap: 5px;
      top: max(10px, var(--sat));
      right: max(12px, var(--sar));
    }
    .small {
      min-width: 36px;
      height: 28px;
      font-size: 9px;
    }

    /* Settings in landscape: full height drawer */
    #settings {
      top: 0;
      transform: none;
      height: 100%;
    }
    #settings-body {
      max-height: 100vh;
      padding: 10px 12px 14px;
    }
  }
</style>

<div id="app"></div>

<div id="hud">
  <div id="stats"></div>

  <div id="run">
    <div id="score">0</div>
    <div id="chain"><span id="mult">x1</span><div id="chain-bar"><i></i></div></div>
    <div id="award"></div>
  </div>

  <div id="trip">
    <div>TRIP <b id="trip-km">0.00</b> km</div>
    <div>ALT <b id="trip-alt">0</b> m</div>
  </div>

  <div id="cluster">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <!-- 240deg arc, opening at the bottom -->
      <path class="tach-track" d="M 40.2 158.6 A 84 84 0 1 1 159.8 158.6" />
      <path class="tach-red"   id="tach-red"  d="M 40.2 158.6 A 84 84 0 1 1 159.8 158.6" />
      <path class="tach-fill"  id="tach-fill" d="M 40.2 158.6 A 84 84 0 1 1 159.8 158.6" />
    </svg>
    <div id="speed-val">0</div>
    <div id="speed-unit">KM / H</div>
    <div id="gear">N</div>
    <div id="gear-mode">AUTO</div>
  </div>
</div>

<div id="settings">
  <div id="settings-panel"><div id="settings-body"></div></div>
  <button id="settings-toggle" type="button" aria-expanded="false" title="Settings">›</button>
</div>

<div id="touch" aria-hidden="true">
  <div class="pad pad-left">
    <button class="tbtn steer" data-hold="left">&#9664;</button>
    <button class="tbtn steer" data-hold="right">&#9654;</button>
  </div>
  <div class="pad pad-right">
    <button class="tbtn pedal" data-hold="brake">&#9660;</button>
    <button class="tbtn pedal go" data-hold="throttle">&#9650;</button>
  </div>
  <div class="pad pad-aux">
    <button class="tbtn small" data-hold="handbrake">HB</button>
    <button class="tbtn small" data-tap="KeyQ">&minus;</button>
    <button class="tbtn small" data-tap="KeyE">+</button>
    <button class="tbtn small" data-tap="KeyL">LT</button>
    <button class="tbtn small" data-hold="flash">FL</button>
    <button class="tbtn small" data-tap="KeyC">CAM</button>
    <button class="tbtn small" data-tap="KeyR">RST</button>
  </div>
</div>

<div id="toast"></div>

<div id="gameover">
  <div class="go-title">Run ended</div>
  <div><b id="go-points">0</b><div class="go-sub">points</div></div>
  <div class="go-sub">Best <b id="go-best">0</b> · <span id="go-detail"></span></div>
  <div class="go-sub" id="go-record"></div>
  <div class="go-actions">
    <button id="go-again" class="eng-chip" type="button">Drive again</button>
    <button id="go-garage" class="eng-chip" type="button">Garage</button>
  </div>
</div>

<div id="overlay">
  <div id="brand">
    <h1 id="title">FASTROADS</h1>
    <p id="tagline">endless procedural roads</p>
  </div>

  <div id="dock">
    <div id="garage">
      <div class="garage-row"><span class="garage-label">Mode</span><span id="mode-list" style="display:flex;gap:7px"></span></div>
      <div id="car-list"></div>
      <div id="car-detail"></div>
      <div class="garage-row"><span class="garage-label">Paint</span><span id="color-list" style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center"></span></div>
      <div class="garage-row"><span class="garage-label">Engine</span><span id="engine-list" style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:660px"></span></div>
      <div class="garage-row">
        <span class="garage-label">Seed</span>
        <input id="seed-input" type="text" spellcheck="false" autocomplete="off" />
        <button id="seed-apply" class="eng-chip" type="button">Generate</button>
        <button id="seed-random" class="eng-chip" type="button">Random</button>
      </div>
    </div>

    <button id="start" disabled>Loading…</button>
    <div id="boot">booting physics runtime…</div>

    <div id="keys">
      <span><b>W S</b> throttle / brake</span>
      <span><b>A D</b> steer</span>
      <span><b>SPACE</b> handbrake</span>
      <span><b>E Q</b> shift</span>
      <span><b>G</b> auto/manual</span>
      <span><b>L</b> lights</span>
      <span><b>F</b> flash</span>
      <span><b>C</b> camera</span>
      <span><b>R</b> respawn</span>
      <span><b>M</b> mute</span>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/+esm"
  }
}
</script>

<script type="module">
  import { boot } from './src/main.js';

  boot().catch((err) => {
    console.error(err);
    const el = document.getElementById('boot');
    el.className = 'err';
    el.textContent = 'FAILED TO START — ' + (err && err.message ? err.message : err) +
      '  ·  this project must be served over http:// (ES modules + WASM). Try: npx serve';
  });
</script>

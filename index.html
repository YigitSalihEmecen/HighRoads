<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e0d12" />
<title>FastRoads — infinite procedural driving</title>

<style>
  /* ==========================================================================
     FASTROADS — interface
     ==========================================================================

     ONE SCALE, NOT A SET OF BREAKPOINTS.

     Every size in this file is a `clamp()` against `vmin` — the SHORT edge of
     the viewport — rather than a fixed pixel value swapped out at 640px. That
     one decision is what makes a phone, a tablet and a desktop the same design
     instead of three: a control sized at 13vmin is a thumb's width on a 390 px
     phone and still a thumb's width on a 1024 px tablet, because a thumb is the
     same size on both. Pixel breakpoints cannot express that — they only know
     how wide the window is, which is why the layout used to have three sets of
     overlapping rules, each re-stating sizes the others had already set.

     `vmin` specifically, not `vw`: it is the same number in portrait and
     landscape, so rotating the device moves things without resizing them.

     The three media queries that remain ask about ORIENTATION, POINTER and
     available HEIGHT — real facts about how the thing is being held and how
     much room there is, not guesses from a width. There are no width
     breakpoints in this file.
     ====================================================================== */

  :root {
    /* ---- palette ------------------------------------------------------- */
    --ink: #f4ead9;
    --dim: rgba(244, 234, 217, 0.58);
    --faint: rgba(244, 234, 217, 0.34);
    --accent: #ffb457;
    --accent-dim: rgba(255, 180, 87, 0.55);
    --accent-wash: rgba(255, 180, 87, 0.13);
    --danger: #ff5f4d;
    --panel: rgba(14, 13, 18, 0.72);
    --panel-solid: rgba(20, 18, 24, 0.9);
    --line: rgba(244, 234, 217, 0.14);
    --line-strong: rgba(244, 234, 217, 0.36);
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);

    --font: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

    /* ---- type ---------------------------------------------------------- */
    --fs-xs: clamp(8.5px, 1.5vmin, 11px);
    --fs-sm: clamp(9.5px, 1.85vmin, 12.5px);
    --fs-md: clamp(11px, 2.2vmin, 14px);
    --fs-lg: clamp(13px, 2.8vmin, 17px);
    --fs-xl: clamp(17px, 4vmin, 24px);
    --fs-display: clamp(28px, 7.5vmin, 54px);
    --fs-huge: clamp(38px, 11vmin, 76px);

    /* ---- rhythm -------------------------------------------------------- */
    --s1: clamp(3px, 0.7vmin, 5px);
    --s2: clamp(5px, 1.1vmin, 8px);
    --s3: clamp(8px, 1.8vmin, 13px);
    --s4: clamp(12px, 2.8vmin, 20px);

    --r-sm: 5px;
    --r-md: 9px;
    --r-lg: 14px;

    /* ---- controls ------------------------------------------------------ */
    /* Driving controls. Round, and sized from the short edge so the thumb
       reaches the same fraction of the screen on any device. */
    --ctl: clamp(64px, 14vmin, 104px);
    --ctl-sm: clamp(44px, 8.5vmin, 58px);
    /* Everything tappable clears the 44 px both platforms ask for. */
    --tap: 44px;

    --cluster: clamp(124px, 30vmin, 208px);

    /* ---- safe areas ---------------------------------------------------- */
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    /* Gutters already include the notch, so nothing has to max() them again. */
    --edge-t: calc(var(--sat) + var(--s4));
    --edge-r: calc(var(--sar) + var(--s4));
    --edge-b: calc(var(--sab) + var(--s4));
    --edge-l: calc(var(--sal) + var(--s4));

    /* How much of the bottom of the screen the driving controls own. Zero
       until the touch layer is switched on, so the desktop HUD is unaffected
       and neither layout needs to know the other exists. */
    --ctl-zone: 0px;
  }

  /* The tallest thing in the bottom row is the right pad's stack — handbrake
     above brake — not a single pedal. Measuring the zone from one pedal put the
     handbrake through the middle of the tachometer. */
  body.touch { --ctl-zone: calc(var(--ctl) + var(--ctl-sm) + var(--s2) + var(--s4)); }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    /* dvh tracks the mobile browser's collapsing chrome; vh does not, and the
       difference is a control sitting under the address bar. */
    height: 100dvh;
    overflow: hidden;
    background: #0e0d12;
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }

  canvas { display: block; touch-action: none; }

  #app { position: fixed; inset: 0; }

  button, input { font-family: var(--font); }
  button { -webkit-tap-highlight-color: transparent; }

  /* ---------------------------------------------------------- primitives -- */

  /**
   * One button, three sizes.
   *
   * `.car-chip` and `.eng-chip` used to be two independent rules that happened
   * to look similar, and `.set-btn` and the game-over buttons were two more.
   * They are all the same object at different sizes, so they share one base and
   * differ only in the two properties that actually differ.
   */
  .car-chip,
  .eng-chip,
  .set-btn {
    border: 1px solid var(--line);
    background: rgba(244, 234, 217, 0.04);
    color: var(--dim);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border-radius: var(--r-sm);
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.18s, border-color 0.18s, background 0.18s, transform 0.12s;
  }
  .car-chip:hover,
  .eng-chip:hover,
  .set-btn:hover { color: var(--ink); border-color: var(--line-strong); }
  .car-chip:active,
  .eng-chip:active,
  .set-btn:active { transform: scale(0.96); }

  .car-chip[aria-pressed="true"],
  .eng-chip[aria-pressed="true"],
  .set-btn.on {
    color: var(--accent);
    border-color: var(--accent-dim);
    background: var(--accent-wash);
  }
  .car-chip[aria-pressed="true"] { box-shadow: 0 0 12px rgba(255, 180, 87, 0.22); }

  .car-chip {
    font-size: var(--fs-sm);
    padding: var(--s2) var(--s3);
    min-height: calc(var(--tap) * 0.72);
  }
  .eng-chip {
    font-size: var(--fs-xs);
    padding: var(--s1) var(--s2);
    min-height: calc(var(--tap) * 0.62);
  }

  /* Tapping a car or an engine blips the throttle; flash the chip with it. */
  .car-chip.revving,
  .eng-chip.revving {
    border-color: rgba(255, 180, 87, 0.9);
    box-shadow: 0 0 14px rgba(255, 180, 87, 0.35);
  }

  .swatch {
    width: clamp(22px, 4.4vmin, 30px);
    height: clamp(22px, 4.4vmin, 30px);
    border-radius: 50%;
    border: 2px solid rgba(244, 234, 217, 0.22);
    padding: 0;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .swatch:hover { transform: scale(1.14); }
  .swatch[aria-pressed="true"] {
    border-color: var(--accent);
    transform: scale(1.2);
    box-shadow: 0 0 10px rgba(255, 180, 87, 0.5);
  }
  /* "Stock" has no colour of its own — it means "leave the model alone". */
  .swatch-stock {
    background:
      linear-gradient(135deg, transparent 44%, var(--faint) 44%, var(--faint) 56%, transparent 56%),
      rgba(244, 234, 217, 0.06);
  }

  /* ---------------------------------------------------------------- HUD -- */

  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease 0.2s;
    z-index: 5;
  }
  #hud.live { opacity: 1; }

  #cluster {
    position: absolute;
    right: var(--edge-r);
    /* Sits clear of the driving controls without knowing they exist: --ctl-zone
       is 0 on a desktop and the height of a pedal on a touch device. */
    bottom: calc(var(--edge-b) + var(--ctl-zone));
    width: var(--cluster);
    height: var(--cluster);
  }
  #cluster svg { width: 100%; height: 100%; overflow: visible; }

  .tach-track { fill: none; stroke: rgba(244, 234, 217, 0.14); stroke-width: 6; stroke-linecap: round; }
  .tach-fill  { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round;
                filter: drop-shadow(0 0 6px rgba(255, 180, 87, 0.55)); }
  .tach-red   { fill: none; stroke: var(--danger); stroke-width: 6; stroke-linecap: round; opacity: 0.35; }

  /* The readouts are positioned as a percentage of the dial, so the whole
     cluster scales as one object from a phone to a desktop. */
  #speed-val {
    position: absolute;
    left: 0; right: 0;
    top: 37%;
    text-align: center;
    font-size: calc(var(--cluster) * 0.23);
    font-weight: 600;
    letter-spacing: -0.05em;
    line-height: 1;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  }
  #speed-unit {
    position: absolute;
    left: 0; right: 0;
    top: 62%;
    text-align: center;
    font-size: calc(var(--cluster) * 0.055);
    letter-spacing: 0.25em;
    color: var(--dim);
  }
  #gear {
    position: absolute;
    left: 0; right: 0;
    bottom: 13%;
    text-align: center;
    font-size: calc(var(--cluster) * 0.075);
    letter-spacing: 0.13em;
    color: var(--accent);
    transition: transform 0.18s ease-out, color 0.18s ease-out, text-shadow 0.18s;
  }
  #gear.shift {
    transform: scale(1.5);
    color: #fff;
    text-shadow: 0 0 14px rgba(255, 180, 87, 0.9);
    transition-duration: 0.04s;
  }
  #gear-mode {
    position: absolute;
    left: 0; right: 0;
    bottom: 5%;
    text-align: center;
    font-size: calc(var(--cluster) * 0.048);
    letter-spacing: 0.25em;
    color: var(--faint);
  }
  #gear-mode.manual { color: var(--accent); }

  #trip {
    position: absolute;
    left: var(--edge-l);
    bottom: calc(var(--edge-b) + var(--ctl-zone));
    font-size: var(--fs-sm);
    line-height: 1.9;
    letter-spacing: 0.08em;
    color: var(--dim);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
  }
  #trip b { color: var(--ink); font-weight: 500; }

  #stats {
    position: absolute;
    left: var(--edge-l);
    top: var(--edge-t);
    font-size: var(--fs-xs);
    line-height: 1.8;
    letter-spacing: 0.08em;
    color: var(--dim);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
  }

  /* ------------------------------------------------------------- run HUD -- */

  #run {
    position: absolute;
    left: 0; right: 0;
    top: var(--edge-t);
    display: none;
    flex-direction: column;
    align-items: center;
    gap: var(--s1);
    z-index: 6;
  }
  /* Only Traffic mode has a score; Zen mode is just driving. */
  #hud.traffic #run { display: flex; }
  /* Keep the score clear of the auxiliary controls in the top corner rather
     than centring it over them. */
  body.touch #run {
    padding-inline: calc(var(--ctl-sm) * 2 + var(--s2) + var(--edge-r));
  }

  #score {
    font-size: var(--fs-xl);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.75);
    transition: transform 0.13s ease-out, color 0.13s ease-out;
  }
  #score.pop { transform: scale(1.16); color: var(--accent); transition-duration: 0.04s; }

  #chain {
    display: flex;
    align-items: center;
    gap: var(--s2);
    opacity: 0;
    transition: opacity 0.3s;
  }
  #chain.live { opacity: 1; }
  #mult { font-size: var(--fs-md); font-weight: 600; color: var(--accent); }
  #chain-bar {
    width: clamp(80px, 22vmin, 140px);
    height: 3px;
    background: rgba(244, 234, 217, 0.16);
    border-radius: 2px;
    overflow: hidden;
  }
  #chain-bar i {
    display: block; height: 100%; width: 100%;
    background: var(--accent);
    transform-origin: left center;
  }

  #award {
    font-size: var(--fs-xs);
    letter-spacing: 0.18em;
    color: var(--accent);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.35s, transform 0.35s;
  }
  #award.show { opacity: 1; transform: translateY(-2px); }
  #award.oncoming { color: #ff9d6b; }

  /* ------------------------------------------------------------ overlay -- */

  /**
   * The middle of the title screen is TRANSPARENT. The car being chosen is the
   * real vehicle, sitting on the real road in the real scene, with the camera
   * orbiting it — so the picker shows exactly what will be driven, and paint
   * changes are simply a live material property rather than a preview of one.
   */
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: var(--s3);
    background:
      linear-gradient(to bottom, rgba(12, 11, 16, 0.94) 0%, rgba(12, 11, 16, 0.5) 14%, rgba(12, 11, 16, 0) 30%),
      linear-gradient(to top,    rgba(12, 11, 16, 0.9) 0%, rgba(12, 11, 16, 0.62) 26%, rgba(12, 11, 16, 0) 56%);
    z-index: 15;
    transition: opacity 0.7s ease, visibility 0s;
    text-align: center;
    padding: var(--edge-t) var(--edge-r) var(--edge-b) var(--edge-l);
    pointer-events: none;
  }
  #overlay.gone {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.7s ease, visibility 0s linear 0.7s;
  }
  /* Only the two panels take input; the gap between them is the car. */
  #brand, #dock { pointer-events: auto; }

  #brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 0 0 auto;
  }

  #title {
    font-size: var(--fs-display);
    font-weight: 700;
    letter-spacing: -0.045em;
    margin: 0;
    line-height: 1;
    background: linear-gradient(100deg, #ffd9a0 0%, #ff9d4d 55%, #e8705a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #tagline {
    margin: var(--s1) 0 0;
    font-size: var(--fs-xs);
    letter-spacing: 0.32em;
    color: var(--dim);
    text-transform: uppercase;
  }

  /* ------------------------------------------------------------- garage -- */

  /**
   * The dock is a panel at every size, not only on a phone.
   *
   * It used to be a bare column on a desktop and a blurred card on mobile, and
   * keeping those two in step is exactly the kind of drift that made the
   * interface look assembled rather than designed. One panel, one set of rules,
   * scaled by the same tokens as everything else.
   */
  #dock {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: var(--s2);
    width: min(940px, 100%);
    max-height: 58dvh;
    /* The DOCK does not scroll — the garage inside it does. Scrolling the whole
       panel put "Drive" below the fold on a landscape phone, which is the one
       control that must never need looking for. */
    overflow: hidden;
    padding: var(--s3) var(--s4);
    background: var(--panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    scrollbar-width: thin;
  }
  #garage {
    display: none;
    flex-direction: column;
    gap: var(--s2);
    /* min-height: 0 is what lets a flex item actually shrink and scroll;
       without it the item refuses to go below its content height and the
       overflow reappears on the panel. */
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    padding-right: var(--s1);
  }
  #garage.ready { display: flex; }
  /**
   * Rows never shrink — they scroll.
   *
   * A flex item's default `flex-shrink: 1` means that in a height-constrained
   * column every row gets squeezed proportionally, and a row squeezed below its
   * content does not scroll, it OVERFLOWS: on a 375 px phone the car blurb was
   * drawn straight through the paint swatches underneath it. Pinning the basis
   * makes the garage overflow as a whole, which is what the scrollbar is for.
   */
  #garage > * { flex: 0 0 auto; }
  #garage::-webkit-scrollbar { width: 5px; }
  #garage::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  /**
   * Every line of the garage is the same two-column grid: a right-aligned
   * label, then the control. Previously the car picker sat outside the grid and
   * the rest sat inside it, so nothing lined up with anything.
   */
  .garage-row {
    display: grid;
    /* Wide enough for the longest label ("ENGINE") at the smallest type size
       and this tracking, so nothing wraps to a second line on a phone. */
    grid-template-columns: clamp(44px, 10vmin, 66px) minmax(0, 1fr);
    align-items: center;
    gap: var(--s3);
    text-align: left;
  }
  .garage-label {
    font-size: var(--fs-xs);
    letter-spacing: 0.16em;
    color: var(--faint);
    text-transform: uppercase;
    text-align: right;
  }

  /* A row of chips that scrolls sideways rather than wrapping into a wall. */
  .row-scroll {
    display: flex;
    align-items: center;
    gap: var(--s2);
    overflow-x: auto;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
    scroll-padding-inline: var(--s3);
  }
  .row-scroll::-webkit-scrollbar { display: none; }
  .row-scroll > * { flex: 0 0 auto; }

  /**
   * Wrapping, for the one row that genuinely needs it: the seed field and its
   * two buttons, where the field should take the slack and the buttons should
   * drop under it when there is none.
   *
   * The colour swatches use `.row-scroll` like every other option row. They
   * used to wrap, and on a phone with 44 px tap targets ten paint swatches and
   * thirteen trim swatches became five stacked rows of circles that filled half
   * the screen — while the car and engine pickers, which have MORE options,
   * scrolled quietly in one line each. Same kind of control, same behaviour.
   */
  .row-wrap {
    display: flex;
    gap: var(--s2);
    flex-wrap: wrap;
    align-items: center;
  }

  #car-detail {
    /* Held at roughly the height of its own content: the blurb and the stat row
       change length with the car, and letting the row collapse moved every
       control below it every time the player tapped a different chip. */
    min-height: 5.2em;
    font-size: var(--fs-sm);
    line-height: 1.55;
    color: var(--dim);
    text-align: center;
    padding: 0 var(--s2);
  }
  #car-detail b { color: var(--ink); font-weight: 500; }

  #car-stats {
    display: flex;
    gap: var(--s4);
    justify-content: center;
    flex-wrap: wrap;
    margin-top: var(--s2);
    font-size: var(--fs-xs);
    letter-spacing: 0.18em;
    color: var(--dim);
    text-transform: uppercase;
  }
  #car-stats span b {
    display: block;
    color: var(--accent);
    font-size: var(--fs-md);
    letter-spacing: 0;
    margin-top: 2px;
    font-weight: 600;
  }

  #seed-input {
    background: rgba(244, 234, 217, 0.05);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: var(--fs-sm);
    letter-spacing: 0.14em;
    padding: var(--s2) var(--s3);
    min-width: 0;
    flex: 1 1 110px;
    border-radius: var(--r-sm);
    outline: none;
  }
  #seed-input:focus { border-color: var(--accent-dim); }

  /* ---- the commit row ------------------------------------------------- */

  #launch {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--s2);
    flex: 0 0 auto;              /* never scrolls away */
    padding-top: var(--s2);
    border-top: 1px solid rgba(244, 234, 217, 0.07);
  }

  #start {
    border: 1px solid var(--accent-dim);
    background: var(--accent-wash);
    color: var(--accent);
    font-size: var(--fs-md);
    font-weight: 600;
    letter-spacing: 0.4em;
    text-indent: 0.4em;         /* balance the tracking on the last glyph */
    padding: var(--s3) var(--s4);
    width: min(320px, 100%);
    min-height: var(--tap);
    border-radius: var(--r-md);
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 4px 18px rgba(255, 180, 87, 0.18);
    transition: background 0.25s, transform 0.15s, opacity 0.3s;
  }
  #start:hover { background: rgba(255, 180, 87, 0.22); }
  #start:active { transform: scale(0.98); }
  #start:disabled { opacity: 0.35; cursor: default; }

  #boot {
    font-size: var(--fs-xs);
    letter-spacing: 0.16em;
    color: var(--dim);
    min-height: 1.2em;
    max-width: 100%;
  }
  #boot.err {
    color: var(--danger);
    letter-spacing: 0.04em;
    /* min() and not a bare 60ch: the boot error is the longest string in the
       interface and it appears on the smallest screens, where 60ch is wider
       than the panel. */
    max-width: min(60ch, 100%);
    line-height: 1.7;
    overflow-wrap: anywhere;
  }

  #keys {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--s1) var(--s3);
    font-size: var(--fs-xs);
    letter-spacing: 0.06em;
    color: var(--faint);
  }
  #keys span { white-space: nowrap; }
  #keys b { color: var(--dim); font-weight: 500; }
  /* A keyboard legend on a device with no keyboard is just clutter. */
  body.touch #keys { display: none; }

  /* ----------------------------------------------------------- settings -- */

  #settings {
    --drawer: clamp(210px, 46vmin, 290px);
    position: fixed;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: stretch;
    z-index: 25;
  }

  #settings-panel {
    width: 0;
    overflow: hidden;
    transition: width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    background: var(--panel-solid);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-left: none;
    border-radius: 0 var(--r-md) var(--r-md) 0;
  }
  #settings.open #settings-panel { width: var(--drawer); }

  #settings-body {
    width: var(--drawer);
    max-height: min(80dvh, 620px);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: var(--s3) var(--s3) var(--s4);
    display: flex;
    flex-direction: column;
    gap: var(--s1);
  }
  #settings-body::-webkit-scrollbar { width: 5px; }
  #settings-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  #settings-toggle {
    align-self: center;
    width: clamp(20px, 4vmin, 26px);
    height: clamp(54px, 11vmin, 76px);
    border: 1px solid var(--line);
    border-left: none;
    border-radius: 0 var(--r-md) var(--r-md) 0;
    background: var(--panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--dim);
    font-size: var(--fs-md);
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
  }
  #settings-toggle:hover { color: var(--ink); background: rgba(30, 28, 32, 0.85); }

  .set-section {
    font-size: var(--fs-xs);
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--faint);
    margin: var(--s3) 0 0;
    border-bottom: 1px solid rgba(244, 234, 217, 0.08);
    padding-bottom: var(--s1);
  }
  .set-section:first-child { margin-top: 0; }

  .set-row {
    display: grid;
    grid-template-columns: minmax(0, 6.6em) minmax(0, 1fr) 2.9em;
    align-items: center;
    gap: var(--s2);
    font-size: var(--fs-xs);
    letter-spacing: 0.06em;
    color: var(--dim);
    min-height: calc(var(--tap) * 0.6);
  }
  .set-name { text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; }
  .set-val { text-align: right; color: var(--dim); }

  .set-row input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    background: rgba(244, 234, 217, 0.18);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .set-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .set-row input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border: none; border-radius: 50%;
    background: var(--accent); cursor: pointer;
  }

  .set-btn {
    font-size: var(--fs-xs);
    padding: var(--s2) var(--s3);
    text-align: left;
    min-height: calc(var(--tap) * 0.72);
  }

  /* -------------------------------------------------------------- touch -- */

  #touch { display: none; }
  /**
   * Shown only where there is a touch screen (see input.js) AND only while
   * actually driving. They used to sit on top of the title screen, live and
   * tappable, with nothing to control — a steering wheel over a menu.
   * `main.js` puts `.driving` on the body when a run starts.
   */
  body.touch.driving #touch {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    touch-action: none;
  }

  .pad {
    position: absolute;
    display: flex;
    align-items: flex-end;
    gap: var(--s3);
    pointer-events: auto;
    touch-action: none;
  }
  .pad-left  { left: var(--edge-l);  bottom: var(--edge-b); }
  .pad-right { right: var(--edge-r); bottom: var(--edge-b); }
  /**
   * Two columns, not three. The auxiliary controls share the top of the screen
   * with the score, which is centred; at three across, a 375 px phone had 67 px
   * left in the middle for a five-figure number. Two columns costs a row of
   * height, which is the dimension there is plenty of.
   */
  .pad-aux   {
    right: var(--edge-r);
    top: var(--edge-t);
    display: grid;
    grid-template-columns: repeat(2, auto);
    gap: var(--s2);
    justify-items: center;
  }

  /* The brake stacks under the handbrake so both sit under one thumb. */
  .pad-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--s2);
  }

  /**
   * Driving controls are CIRCLES.
   *
   * A thumb's contact patch is round and it lands where it lands; a rounded
   * square advertises corners that are no easier to hit than the ones outside
   * it. A circle is also unambiguous about its own centre, which is what you
   * are aiming at when you re-find a pedal without looking at it.
   */
  .tbtn {
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(244, 234, 217, 0.24);
    background: rgba(18, 17, 20, 0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--ink);
    border-radius: 50%;
    aspect-ratio: 1;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    transition: background 0.08s, transform 0.08s, border-color 0.08s, box-shadow 0.08s;
  }
  .tbtn:active, .tbtn.on {
    background: rgba(255, 180, 87, 0.38);
    border-color: rgba(255, 180, 87, 0.85);
    box-shadow: 0 0 16px rgba(255, 180, 87, 0.5);
    transform: scale(0.94);
  }

  .tbtn-lg {
    width: var(--ctl);
    height: var(--ctl);
    font-size: calc(var(--ctl) * 0.3);
    line-height: 1;
  }
  .tbtn-sm {
    width: var(--ctl-sm);
    height: var(--ctl-sm);
    font-size: calc(var(--ctl-sm) * 0.26);
    letter-spacing: 0.04em;
  }

  /* Throttle reads green, brake reads neutral — the one place colour carries
     meaning rather than decoration. */
  .tbtn-go {
    background: rgba(45, 125, 65, 0.45);
    border-color: rgba(90, 200, 120, 0.42);
  }
  .tbtn-go:active, .tbtn-go.on {
    background: rgba(60, 160, 85, 0.72);
    border-color: rgba(100, 240, 140, 0.9);
    box-shadow: 0 0 18px rgba(90, 220, 130, 0.6);
  }

  /* ----------------------------------------------------------- game over -- */

  #gameover {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--s3);
    text-align: center;
    padding: var(--edge-t) var(--edge-r) var(--edge-b) var(--edge-l);
    background: radial-gradient(120% 90% at 50% 45%, rgba(34, 20, 18, 0.88) 0%, rgba(10, 9, 13, 0.96) 70%);
  }
  #gameover.show { display: flex; }
  .go-title {
    font-size: var(--fs-sm);
    letter-spacing: 0.45em;
    color: var(--danger);
    text-transform: uppercase;
  }
  #go-points {
    display: block;
    font-size: var(--fs-huge);
    font-weight: 700;
    letter-spacing: -0.05em;
    line-height: 1;
  }
  .go-sub {
    font-size: var(--fs-xs);
    letter-spacing: 0.22em;
    color: var(--dim);
    text-transform: uppercase;
  }
  #go-record { color: var(--accent); min-height: 1.2em; }
  .go-actions {
    display: flex;
    gap: var(--s3);
    margin-top: var(--s2);
    flex-wrap: wrap;
    justify-content: center;
  }
  .go-actions .eng-chip {
    font-size: var(--fs-sm);
    padding: var(--s3) var(--s4);
    min-height: var(--tap);
  }

  #toast {
    position: fixed;
    left: 50%;
    top: calc(var(--edge-t) + var(--s4));
    transform: translateX(-50%);
    font-size: var(--fs-sm);
    letter-spacing: 0.22em;
    color: var(--ink);
    background: rgba(20, 17, 16, 0.82);
    border: 1px solid var(--line);
    padding: var(--s2) var(--s4);
    border-radius: var(--r-sm);
    opacity: 0;
    transition: opacity 0.35s;
    pointer-events: none;
    z-index: 28;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* ==================================================== ORIENTATION ===== */

  /**
   * The only layout that genuinely differs, and it differs because of where
   * the hands are, not because of how many pixels there are.
   *
   * PORTRAIT: both thumbs are at the bottom corners and the middle of the
   * screen is a tall empty column, so the instruments stack above the controls.
   *
   * LANDSCAPE: the thumbs are at the bottom corners and the space BETWEEN them
   * is the widest free area on the screen, so the cluster goes there and the
   * trip readout moves to the top-left where nothing else is.
   */
  @media (orientation: landscape) {
    body.touch #cluster {
      right: auto;
      left: 50%;
      bottom: var(--edge-b);
      transform: translateX(-50%);
      width: clamp(110px, 26vmin, 180px);
      height: clamp(110px, 26vmin, 180px);
      --cluster: clamp(110px, 26vmin, 180px);
    }
    body.touch #trip {
      bottom: auto;
      top: calc(var(--edge-t) + 3.4em);
    }
  }

  /**
   * Short screens — a phone on its side, not a desktop.
   *
   * This is a HEIGHT query, and it is the one axis a query can honestly ask
   * about: "is there room above the panel for a title?". Keying it to
   * `orientation: landscape` instead swept in every desktop monitor, which has
   * 900 px of height and no such problem, and put the brand in the corner there
   * for no reason. Height is the constraint, so height is the question.
   */
  @media (max-height: 620px) {
    #brand {
      position: absolute;
      top: var(--edge-t);
      left: var(--edge-l);
      align-items: flex-start;
      text-align: left;
    }
    /* With the brand out of flow the dock is the only child left, so it needs
       telling which end of the overlay to sit at. */
    #overlay { justify-content: flex-end; }
    #dock { max-height: 80dvh; }
    /* Wordmark down a size and the tagline gone: at full size the title ran
       under the top edge of the panel, and a subtitle is the first thing that
       should go when there is 393 px of screen to spend. */
    #title { font-size: clamp(19px, 5.2vmin, 30px); }
    #tagline { display: none; }
  }

  /* A mouse can hit a 22px target; a finger cannot. Anything driven by a
     coarse pointer gets the full tap size, everywhere, once. */
  @media (pointer: coarse) {
    .swatch { width: var(--tap); height: var(--tap); }
    .car-chip, .eng-chip, .set-btn { min-height: var(--tap); }
    #settings-toggle { width: calc(var(--tap) * 0.7); }
    #seed-input { min-height: var(--tap); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }
</style>
